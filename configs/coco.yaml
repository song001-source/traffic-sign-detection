# COCO 交通标志数据集配置
# 46 类中国交通标志检测
# 训练集：6809 张
# 验证集：1953 张

path: ../data/coco
train: images/train
val: images/val

# 46 类中国交通标志（中英文对照）
names:
  0: pl80       # 限制速度（80公里/小时）
  1: p6         # 禁止非机动车进入
  2: p5         # 禁止掉头
  3: pm55       # 限制质量（55吨）
  4: pl60       # 限制速度（60公里/小时）
  5: ip         # 人行横道
  6: p11        # 禁止鸣喇叭
  7: i2r        # 非机动车行驶
  8: p23        # 禁止向左转弯
  9: pg         # 减速让行
  10: il80      # 最低限速（80公里/小时）
  11: ph4       # 限制高度（4米）
  12: i4        # 靠右侧道路行驶
  13: pl70      # 限制速度（70公里/小时）
  14: pne       # 禁止驶入
  15: ph4.5     # 限制高度（4.5米）
  16: p12       # 禁止二轮摩托车驶入
  17: p3        # 禁止大型客车驶入
  18: pl5       # 限制速度（5公里/小时）
  19: w13       # 傍山险路
  20: i4l       # 靠左侧道路行驶
  21: pl30      # 限制速度（30公里/小时）
  22: p10       # 禁止机动车驶入
  23: pn        # 禁止停车
  24: w55       # 注意儿童
  25: p26       # 禁止载货汽车驶入
  26: p13       # 路名牌
  27: pr40      # 解除限制速度（40公里/小时）
  28: pl20      # 限制速度（20公里/小时）
  29: pm30      # 限制质量（30吨）
  30: pl40      # 限制速度（40公里/小时）
  31: i2        # 机动车行驶
  32: pl120     # 限制速度（120公里/小时）
  33: w32       # 无人看守铁路道口
  34: ph5       # 限制高度（5米）
  35: il60      # 最低限速（60公里/小时）
  36: w57       # 注意行人
  37: pl100     # 限制速度（100公里/小时）
  38: w59       # 注意合流
  39: il100     # 最低限速（100公里/小时）
  40: p19       # 禁止向右转弯
  41: pm20      # 限制质量（20吨）
  42: i5        # 靠左侧道路行驶
  43: p27       # 禁止运输危险物品车辆驶入
  44: pl50      # 限制速度（50公里/小时）
  45: wo        # 其他
